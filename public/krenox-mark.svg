<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="krx_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062b30"/>
      <stop offset="50%" stop-color="#0a3e45"/>
      <stop offset="100%" stop-color="#041a1d"/>
    </linearGradient>

    <!-- Main Stem Gradient -->
    <linearGradient id="krx_stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00b874"/>
    </linearGradient>

    <!-- Upper Arm Gradient -->
    <linearGradient id="krx_upper" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#d4fff0"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>

    <!-- Lower Flow Gradient -->
    <linearGradient id="krx_lower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="krx_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00f5a0" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Icon Shield -->
  <rect width="120" height="120" rx="34" fill="url(#krx_bg)"/>
  <rect x="1" y="1" width="118" height="118" rx="33" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Left Pillar / Queue Axis -->
  <rect x="28" y="24" width="16" height="72" rx="8" fill="url(#krx_stem)"/>

  <!-- Upper Flow Vector (Incoming stream) -->
  <path d="M48 56L79 27C82 24 87 26 87 30V40C87 43 85 46 82 48L61 64L48 56Z" fill="url(#krx_upper)"/>

  <!-- Lower Flow Vector (Summoned Forward) -->
  <path d="M48 64L81 92C84 94 88 92 88 88V77C88 74 86 71 83 69L63 53L48 64Z" fill="url(#krx_lower)"/>

  <!-- Dynamic Pulse Node (Real-time Summon Anchor) -->
  <circle cx="56" cy="60" r="7" fill="#ffffff" filter="url(#krx_glow)"/>
  <circle cx="56" cy="60" r="4" fill="#00f5a0"/>
</svg>
